<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>胡克铰位移流形 · 浸入像 vs 真实图形</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background-color: #0a0a14;
            color: white;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 10, 20, 0.8);
            backdrop-filter: blur(8px);
            padding: 16px 24px;
            border-radius: 16px;
            border-left: 4px solid #ffaa44;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            pointer-events: none;
            z-index: 100;
        }
        #info h1 {
            margin: 0 0 6px 0;
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: 1px;
            color: #ffaa44;
        }
        #info p {
            margin: 4px 0;
            font-size: 0.9rem;
            opacity: 0.9;
            color: #ddd;
        }
        #mode-panel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
            background: rgba(20, 20, 30, 0.8);
            backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-radius: 60px;
            border: 1px solid #333;
            box-shadow: 0 8px 32px rgba(0,0,0,0.7);
            z-index: 200;
            pointer-events: auto;
        }
        .mode-btn {
            background: transparent;
            border: 1px solid #555;
            color: #ccc;
            padding: 10px 28px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }
        .mode-btn:hover {
            background: rgba(255, 170, 68, 0.15);
            border-color: #ffaa44;
            color: #ffaa44;
        }
        .mode-btn.active {
            background: #ffaa44;
            border-color: #ffaa44;
            color: #0a0a14;
            font-weight: 600;
            box-shadow: 0 0 20px rgba(255, 170, 68, 0.4);
        }
        .legend {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(20, 20, 30, 0.8);
            backdrop-filter: blur(8px);
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid #333;
            font-size: 0.85rem;
            z-index: 100;
            pointer-events: none;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            margin-right: 10px;
        }
        .legend-color.gold { background: #ffaa44; box-shadow: 0 0 10px #ffaa44; }
        .legend-color.cyan { background: #44ccff; box-shadow: 0 0 10px #44ccff; }
        .legend-color.red { background: #ff4466; box-shadow: 0 0 10px #ff4466; }
        .legend-color.purple { background: #aa66ff; box-shadow: 0 0 10px #aa66ff; }
        .legend-text {
            color: #ddd;
        }
        .legend-text small {
            color: #888;
            display: block;
            font-size: 0.7rem;
        }
        .controls-hint {
            position: absolute;
            bottom: 100px;
            right: 20px;
            background: rgba(30, 30, 40, 0.7);
            backdrop-filter: blur(4px);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #aaa;
            border: 1px solid #444;
            z-index: 100;
            pointer-events: none;
        }
        #note {
            position: absolute;
            bottom: 100px;
            left: 20px;
            color: #aaa;
            font-size: 0.85rem;
            background: rgba(0,0,0,0.4);
            padding: 8px 16px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            z-index: 100;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>胡克铰位移流形</h1>
        <p id="mode-desc">当前模式：<span style="color:#ffaa44;font-weight:600;">浸入像</span> — 两条奇异线被捏扁</p>
    </div>

    <div class="legend">
        <div class="legend-item">
            <div class="legend-color gold"></div>
            <div class="legend-text">位移流形 (金色)<small>浸入像 / 真实图形</small></div>
        </div>
        <div class="legend-item">
            <div class="legend-color cyan"></div>
            <div class="legend-text">参数网格 (θ₁, θ₂)<small>映射到 SO(3)</small></div>
        </div>
        <div class="legend-item">
            <div class="legend-color red"></div>
            <div class="legend-text">奇异线 θ₂=0 / π<small>被捏扁 · 退化</small></div>
        </div>
        <div class="legend-item">
            <div class="legend-color purple"></div>
            <div class="legend-text">旋转轴示意<small>外轴固定 · 内轴随动</small></div>
        </div>
    </div>

    <div id="mode-panel">
        <button id="btn-immersion" class="mode-btn active">浸入像</button>
        <button id="btn-real" class="mode-btn">真实图形</button>
    </div>

    <div class="controls-hint">拖动旋转 · 滚轮缩放</div>
    <div id="note">被捏扁的甜甜圈 —— 两条奇异线上，二维退化为一维</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.126.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.126.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 初始化场景 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a14);
        scene.fog = new THREE.FogExp2(0x0a0a14, 0.008);

        // --- 相机 ---
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 3, 8);
        camera.lookAt(1.5, 0, 0);

        // --- 渲染器 ---
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- 控制器 ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.8;
        controls.zoomSpeed = 1.2;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.8;
        controls.target.set(1.5, 0, 0);

        // --- 灯光 ---
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        const light1 = new THREE.PointLight(0xffaa66, 1.2, 30);
        light1.position.set(2, 5, 5);
        scene.add(light1);

        const light2 = new THREE.PointLight(0x4466ff, 0.8, 30);
        light2.position.set(-3, 1, -5);
        scene.add(light2);

        const light3 = new THREE.DirectionalLight(0xffffff, 0.6);
        light3.position.set(1, 3, 2);
        scene.add(light3);

        const fillLight = new THREE.PointLight(0x8866ff, 0.4);
        fillLight.position.set(4, -1, 3);
        scene.add(fillLight);

        // --- 辅助地面网格 ---
        const gridHelper = new THREE.GridHelper(12, 20, 0x334466, 0x223344);
        gridHelper.position.y = -2.5;
        scene.add(gridHelper);

        // --- 环境星星 ---
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 1200;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount * 3; i += 3) {
            starsPos[i] = (Math.random() - 0.5) * 200;
            starsPos[i+1] = (Math.random() - 0.5) * 200;
            starsPos[i+2] = (Math.random() - 0.5) * 200;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0x88aaff, size: 0.15, transparent: true, opacity: 0.6 });
        const stars = new THREE.Points(starsGeo, starsMat);
        scene.add(stars);

        // ============================================================
        // 核心：构建两种模式的几何体
        // ============================================================

        const R = 1.8;      // 大半径
        const r = 0.9;      // 小半径
        const tubularSegments = 120;
        const radialSegments = 60;
        const centerPos = new THREE.Vector3(1.5, 0, 0);

        // --- 公共：旋转轴示意 ---
        const axisGroup = new THREE.Group();
        axisGroup.position.copy(centerPos);
        
        const axisOuterGeo = new THREE.CylinderGeometry(0.04, 0.04, 2.8, 8);
        const axisOuterMat = new THREE.MeshStandardMaterial({ color: 0xaa66ff, emissive: 0x331144, transparent: true, opacity: 0.5 });
        const axisOuter = new THREE.Mesh(axisOuterGeo, axisOuterMat);
        axisGroup.add(axisOuter);
        scene.add(axisGroup);

        // --- 模式1：浸入像 (被捏扁的甜甜圈) ---
        const immersionGroup = new THREE.Group();
        immersionGroup.position.copy(centerPos);

        // 创建标准环面几何体，但修改顶点颜色，使奇异线附近变红
        const torusGeo = new THREE.TorusGeometry(R, r, radialSegments, tubularSegments);
        const positionAttribute = torusGeo.attributes.position;
        const vertexCount = positionAttribute.count;
        const colors = [];

        for (let i = 0; i < vertexCount; i++) {
            const ix = positionAttribute.getX(i);
            const iy = positionAttribute.getY(i);
            const iz = positionAttribute.getZ(i);

            const radial = Math.sqrt(ix*ix + iy*iy) - R;
            let v = Math.atan2(iz, radial);
            if (v < 0) v += Math.PI * 2;

            const distTo0 = Math.min(v, 2*Math.PI - v);
            const distToPi = Math.abs(v - Math.PI);
            const minDist = Math.min(distTo0, distToPi);
            const t = Math.min(minDist / (Math.PI/2), 1.0);

            const red = 1.0;
            const green = 0.27 + 0.4 * t;
            const blue = 0.4 * (1 - t);
            colors.push(red, green, blue);
        }
        torusGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

        const torusMat = new THREE.MeshPhongMaterial({
            vertexColors: true,
            emissive: new THREE.Color(0x221100),
            shininess: 30,
            transparent: true,
            opacity: 0.85,
            side: THREE.DoubleSide,
            flatShading: false
        });

        const torusMesh = new THREE.Mesh(torusGeo, torusMat);
        torusMesh.rotation.y = 0.3;
        torusMesh.rotation.z = 0.2;
        immersionGroup.add(torusMesh);

        // 添加两条红色的奇异线（外赤道 v=0 和 内赤道 v=π）
        const segments = 128;
        const outerPoints = [];
        const innerPoints = [];
        for (let i = 0; i <= segments; i++) {
            const u = (i / segments) * Math.PI * 2;
            outerPoints.push(new THREE.Vector3((R + r) * Math.cos(u), (R + r) * Math.sin(u), 0));
            innerPoints.push(new THREE.Vector3((R - r) * Math.cos(u), (R - r) * Math.sin(u), 0));
        }

        const outerTubeGeo = new THREE.TubeGeometry(
            new THREE.CatmullRomCurve3(outerPoints, true), 200, 0.04, 8, false
        );
        const innerTubeGeo = new THREE.TubeGeometry(
            new THREE.CatmullRomCurve3(innerPoints, true), 200, 0.04, 8, false
        );

        const redMat = new THREE.MeshStandardMaterial({
            color: 0xff4466,
            emissive: 0x441122,
            roughness: 0.3,
            metalness: 0.2
        });

        const outerTube = new THREE.Mesh(outerTubeGeo, redMat);
        const innerTube = new THREE.Mesh(innerTubeGeo, redMat);
        torusMesh.add(outerTube);
        torusMesh.add(innerTube);

        // 参数网格（半透明青色线框）
        const wireframeGeo = new THREE.TorusGeometry(R, r, 24, 48);
        const wireframeMat = new THREE.MeshBasicMaterial({
            color: 0x44ccff,
            wireframe: true,
            transparent: true,
            opacity: 0.15
        });
        const wireframeMesh = new THREE.Mesh(wireframeGeo, wireframeMat);
        wireframeMesh.rotation.copy(torusMesh.rotation);
        immersionGroup.add(wireframeMesh);

        scene.add(immersionGroup);

        // --- 模式2：真实图形 (参数环面 T²) ---
        const realGroup = new THREE.Group();
        realGroup.position.copy(centerPos);
        realGroup.visible = false; // 默认隐藏

        // 真实图形就是一个标准的、光滑的环面，没有捏扁，没有红色奇异线
        // 但为了区分，我们使用金色/青色的渐变，保持美观
        const realTorusGeo = new THREE.TorusGeometry(R, r, radialSegments, tubularSegments);
        
        // 为真实图形添加微妙的颜色渐变（基于v角度的青色到金色）
        const realPositionAttr = realTorusGeo.attributes.position;
        const realColors = [];
        for (let i = 0; i < realPositionAttr.count; i++) {
            const ix = realPositionAttr.getX(i);
            const iy = realPositionAttr.getY(i);
            const iz = realPositionAttr.getZ(i);
            const radial = Math.sqrt(ix*ix + iy*iy) - R;
            let v = Math.atan2(iz, radial);
            if (v < 0) v += Math.PI * 2;
            // 颜色从金色(#ffaa44) 到 青色(#44ccff) 渐变
            const t = v / (Math.PI * 2); // 0 到 1
            const red = 1.0 - 0.7 * t;      // 1.0 -> 0.3
            const green = 0.67 + 0.13 * t;  // 0.67 -> 0.8
            const blue = 0.27 + 0.53 * t;   // 0.27 -> 0.8
            realColors.push(red, green, blue);
        }
        realTorusGeo.setAttribute('color', new THREE.Float32BufferAttribute(realColors, 3));

        const realTorusMat = new THREE.MeshPhongMaterial({
            vertexColors: true,
            emissive: new THREE.Color(0x112233),
            shininess: 40,
            transparent: true,
            opacity: 0.9,
            side: THREE.DoubleSide,
            flatShading: false
        });

        const realTorusMesh = new THREE.Mesh(realTorusGeo, realTorusMat);
        realTorusMesh.rotation.y = 0.3;
        realTorusMesh.rotation.z = 0.2;
        realGroup.add(realTorusMesh);

        // 真实图形的参数网格（更亮一些，表示完整的T²）
        const realWireframeGeo = new THREE.TorusGeometry(R, r, 24, 48);
        const realWireframeMat = new THREE.MeshBasicMaterial({
            color: 0x44ccff,
            wireframe: true,
            transparent: true,
            opacity: 0.25
        });
        const realWireframeMesh = new THREE.Mesh(realWireframeGeo, realWireframeMat);
        realWireframeMesh.rotation.copy(realTorusMesh.rotation);
        realGroup.add(realWireframeMesh);

        // 真实图形不需要红色奇异线，但可以添加两条淡淡的参考线表示参数位置（非奇异，只是标记）
        const refLineMat = new THREE.LineBasicMaterial({ color: 0x44ccff, transparent: true, opacity: 0.3 });
        // 外赤道
        const refOuterGeo = new THREE.BufferGeometry().setFromPoints(outerPoints);
        const refOuterLine = new THREE.Line(refOuterGeo, refLineMat);
        // 内赤道
        const refInnerGeo = new THREE.BufferGeometry().setFromPoints(innerPoints);
        const refInnerLine = new THREE.Line(refInnerGeo, refLineMat);
        realTorusMesh.add(refOuterLine);
        realTorusMesh.add(refInnerLine);

        scene.add(realGroup);

        // ============================================================
        // 模式切换逻辑
        // ============================================================

        const btnImmersion = document.getElementById('btn-immersion');
        const btnReal = document.getElementById('btn-real');
        const modeDesc = document.getElementById('mode-desc');
        const noteEl = document.getElementById('note');

        function setMode(mode) {
            if (mode === 'immersion') {
                immersionGroup.visible = true;
                realGroup.visible = false;
                btnImmersion.classList.add('active');
                btnReal.classList.remove('active');
                modeDesc.innerHTML = '当前模式：<span style="color:#ffaa44;font-weight:600;">浸入像</span> — 两条奇异线被捏扁';
                noteEl.textContent = '被捏扁的甜甜圈 —— 两条奇异线上，二维退化为一维';
            } else {
                immersionGroup.visible = false;
                realGroup.visible = true;
                btnReal.classList.add('active');
                btnImmersion.classList.remove('active');
                modeDesc.innerHTML = '当前模式：<span style="color:#44ccff;font-weight:600;">真实图形</span> — 光滑的环面 T²';
                noteEl.textContent = '光滑完整的环面 —— 参数空间 (θ₁, θ₂) 的直积，无退化';
            }
        }

        btnImmersion.addEventListener('click', () => setMode('immersion'));
        btnReal.addEventListener('click', () => setMode('real'));

        // ============================================================
        // 动画循环
        // ============================================================

        let clock = new THREE.Clock();

        function animate() {
            const elapsedTime = performance.now() * 0.001;

            controls.update();

            // 星星缓慢旋转
            stars.rotation.y += 0.0001;
            stars.rotation.x += 0.00005;

            // 浸入像的红色脉冲效果
            const pulse = Math.sin(elapsedTime * 3) * 0.15 + 0.85;
            redMat.emissiveIntensity = pulse;

            // 浸入像线框透明度微调
            wireframeMat.opacity = 0.15 + Math.sin(elapsedTime * 2) * 0.05;

            // 真实图形线框透明度微调
            realWireframeMat.opacity = 0.25 + Math.sin(elapsedTime * 2) * 0.05;

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        animate();

        // ============================================================
        // 窗口大小自适应
        // ============================================================

        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 自动旋转交互优化
        let autoRotateTimeout;
        controls.addEventListener('start', () => {
            controls.autoRotate = false;
            if (autoRotateTimeout) clearTimeout(autoRotateTimeout);
        });
        controls.addEventListener('end', () => {
            autoRotateTimeout = setTimeout(() => {
                controls.autoRotate = true;
            }, 3000);
        });

    </script>
</body>
</html>
